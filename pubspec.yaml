name: compass_app

description: A simple offline compass app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  flutter_compass: ^0.8.1
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/compass_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/compass_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/compass_icon.png"
  min_sdk_android: 21